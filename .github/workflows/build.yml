name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak proyek
        run: unzip -q ps4-kbm.zip
      - name: Tes logika
        run: make -C ps4-kbm test
      - name: Pasang toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld llvm
          command -v llvm-ar || sudo ln -sf "$(ls /usr/bin/llvm-ar-* | head -1)" /usr/bin/llvm-ar
          mkdir oo && cd oo
          gh release download -R OpenOrbis/OpenOrbis-PS4-Toolchain --pattern "*.tar.gz"
          ls -la
          for f in *.tar.gz; do tar xzf "$f"; done
          cd ..
          OO=$(dirname "$(find "$PWD/oo" -name link.x | head -1)")
          echo "OO_PS4_TOOLCHAIN=$OO" >> "$GITHUB_ENV"
          chmod -R +x "$OO/bin/linux" || true
          echo "Toolchain: $OO"
      - name: Pasang GoldHEN SDK
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git sdk
          make -C sdk
          ls sdk
          echo "GOLDHEN_SDK=$PWD/sdk" >> "$GITHUB_ENV"
      - name: Build plugin
        run: make -C ps4-kbm
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-kbm-prx
          path: ps4-kbm/*.prx
